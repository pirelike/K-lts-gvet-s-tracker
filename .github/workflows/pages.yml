name: Deploy to GitHub Pages

# Minden push a főágra: teszt + build + kiadás a GitHub Pages-re.
# Egyszeri beállítás a repóban: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # A Pages a https://<felhasználó>.github.io/<repo-neve>/ címen szolgál ki, ezért kell a base path.
      # A szinkron nyilvános kliens-azonosítói a repó Variables értékeiből jönnek (Settings → Secrets and variables →
      # Actions → Variables). Nem titkok; ha hiányoznak, az adott szolgáltató nem jelenik meg az appban.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
